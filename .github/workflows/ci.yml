name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same wrapper used locally - no Maven installed on the host.
      - name: Build and run all tests in Docker
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Build runtime image
        run: docker build -t crawlforge:ci .
