# CrawlForge runtime configuration. All commands run inside Docker.
scraper.maxThreads=4
scraper.timeoutMs=15000

scraper.retry.attempts=3
scraper.retry.baseDelayMs=300
scraper.retry.maxDelayMs=4000
scraper.retry.exponential=true

scraper.rate.requestsPerSecond=2.0

scraper.browser.headless=true
scraper.browser.javascriptEnabled=false

scraper.outputDir=output

# Comma-separated User-Agents; leave blank to use the built-in rotating defaults.
scraper.userAgents=

# Comma-separated proxies: host:port or user:password@host:port.
scraper.proxies=

# Optional SQL persistence. Override with SCRAPER_DB_* environment variables in Docker.
scraper.db.url=
scraper.db.user=
scraper.db.password=
